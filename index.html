<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYC Trip">
<title>Voyage à New York 2026</title>
<style>
:root{
  --bg:#0d0d0d;
  --surface:#1a1a1a;
  --surface2:#232323;
  --text:#f5f5f0;
  --text-dim:#9a9a94;
  --line:#2c2c2c;
  --accent:#EE352E;
  --free:#00933C;
  --free-bg:#0e2418;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#0d0d0d;color:#f5f5f0;
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  overflow:hidden;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* ===== Screens ===== */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;
  -webkit-overflow-scrolling:touch; padding-bottom: calc(74px + var(--safe-bottom));}
.screen.active{display:flex;}

/* ===== Top bar ===== */
.topbar{padding:calc(14px + var(--safe-top)) 18px 12px; display:flex; align-items:center; gap:10px;
  background:#0d0d0d; position:sticky; top:0; z-index:5; border-bottom:1px solid #2c2c2c;}
.topbar .backbtn{width:34px;height:34px;border-radius:50%;background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#f5f5f0;
  flex-shrink:0; border:none;}
.topbar h1{font-size:17px; font-weight:800; letter-spacing:0.3px; margin:0; flex:1;
  text-transform:uppercase;}
.topbar .bullet{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center; font-weight:800; font-size:14px; color:#fff; flex-shrink:0;}

/* ===== HOME SCREEN ===== */
.hero{padding: calc(28px + var(--safe-top)) 20px 20px; text-align:center;
  background: radial-gradient(circle at 50% 0%, #1c1224 0%, #0d0d0d 70%);
  border-bottom:4px solid #2c2c2c;}
.hero .eyebrow{font-size:11px; letter-spacing:3px; color:#9a9a94; text-transform:uppercase; font-weight:700;}
.hero h1{font-size:26px; font-weight:800; margin:8px 0 4px; letter-spacing:0.5px; line-height:1.15; color:#f5f5f0;}
.hero .sub{font-size:13px; color:#9a9a94;}
.hero .stats{display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
.stat{background:#1a1a1a; border-radius:10px; padding:8px 12px; font-size:11px; color:#9a9a94;}
.stat b{display:block; font-size:16px; color:#f5f5f0; font-weight:800;}

.linemap{padding:18px 0 10px;}
.linemap .maptitle{padding:0 20px 12px; font-size:12px; letter-spacing:2px; color:#9a9a94;
  text-transform:uppercase; font-weight:700;}
.dayrow{display:flex; align-items:center; gap:14px; padding:13px 20px; position:relative;}
.dayrow:active{background:#1a1a1a;}
.dayrow .track{position:relative; width:34px; display:flex; justify-content:center; flex-shrink:0;}
.dayrow .track::before{content:''; position:absolute; top:-13px; bottom:-13px; width:4px; background:var(--dot-color, #333); z-index:0;}
.dayrow:first-child .track::before{top:50%;}
.dayrow:last-child .track::before{bottom:50%;}
.dayrow .dot{position:relative; z-index:1; width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center; font-weight:800; font-size:13px; color:#fff;
  border:3px solid #0d0d0d;}
.dayrow .info{flex:1; min-width:0;}
.dayrow .info .d1{font-size:11px; color:#9a9a94; text-transform:uppercase; letter-spacing:1px; font-weight:600;}
.dayrow .info .d2{font-size:15.5px; font-weight:700; margin-top:1px; color:#f5f5f0;}
.dayrow .chev{color:#9a9a94; font-size:16px;}
.dayrow .progress{font-size:10.5px; color:#9a9a94; margin-top:2px;}

/* ===== DAY SCREEN ===== */
.daymeta{padding:16px 18px 14px; border-bottom:3px solid #2c2c2c;}
.daymeta .d1{font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:#9a9a94; font-weight:700;}
.daymeta .d2{font-size:21px; font-weight:800; margin-top:2px;}
.quote{margin:14px 18px; padding:14px 16px; background:#1a1a1a; border-left:4px solid var(--dot-color,#666);
  border-radius:0 10px 10px 0; font-size:13.5px; font-style:italic; color:#d8d8d2; line-height:1.5;}
.quote .auth{display:block; margin-top:8px; font-style:normal; font-weight:700; font-size:12px; color:#9a9a94;}
.daynote{margin:0 18px 14px; padding:10px 14px; background:#241c0c; border-radius:10px; font-size:12.5px;
  font-style:italic; color:#e0c98a;}

.timeline{padding:6px 18px 30px;}
.trow{display:flex; gap:12px; position:relative;}
.trow .rail{width:26px; display:flex; flex-direction:column; align-items:center; flex-shrink:0;}
.trow .rail .seg{width:4px; flex:1; background:var(--dot-color,#333);}
.trow .rail .node{width:16px;height:16px;border-radius:50%; background:var(--dot-color,#333); flex-shrink:0;
  border:3px solid #0d0d0d; margin: 2px 0;}
.trow.done .rail .node{background:#3a3a3a;}
.trow .content{flex:1; min-width:0; padding: 0 0 18px;}
.card{background:#1a1a1a; border-radius:14px; padding:13px 14px; position:relative;}
.card.end{background:#232323; border:none; border-left: 5px solid #555; padding:12px 14px;}
.card.end .act{color:#f5f5f0;}
.card.done{opacity:0.45;}
.card .ctop{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.card .cardicon{font-size:16px; margin-right:2px;}
.card .time{font-weight:800; font-size:15px; color:var(--dot-color,#fff); margin-right:auto;}
.card .dur{font-size:11.5px; color:#9a9a94; white-space:nowrap;}
.card .act{font-size:15px; font-weight:600; margin-top:4px; line-height:1.35;}
.card .act a{color:inherit;}
.card .act b{color:var(--dot-color,#fff);}
.card .brow{display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:8px;}
.card .price{font-size:11.5px; background:#2a2020; color:#e6a5a0; padding:3px 9px; border-radius:8px; font-weight:700;}
.card .price.free{background:#0e2418; color:#4fd88a;}
.card .cb{width:26px;height:26px;border-radius:50%; border:2px solid #444; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent;}
.card.done .cb{background:#3a3a3a; border-color:#3a3a3a; color:#8a8a8a;}
.connector{display:flex; align-items:center; gap:8px; padding:6px 0 6px 2px; font-size:12.5px; color:#9a9a94;}
.connector .ic{font-size:13px;}
.connector .maplink{margin-left:auto; color:#5b9dff; font-weight:700; font-size:12px; text-decoration:none; padding:4px 4px;}

/* ===== BUDGET SCREEN ===== */
.budgetcard{margin:16px 18px; background:#1a1a1a; border-radius:16px; padding:18px;}
.budgetcard h2{margin:0 0 14px; font-size:15px; text-transform:uppercase; letter-spacing:1.5px;}
.brow2{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #2c2c2c; font-size:14px;}
.brow2 b{font-weight:800;}
.brow2.total{border-bottom:none; padding-top:14px; font-size:17px;}
.brow2.total span:first-child, .brow2.total b{color:#ffd54f;}
.budgetnote{margin:0 18px; font-size:11.5px; color:#9a9a94; font-style:italic; line-height:1.5;}
.warnbox{margin:14px 18px; padding:12px 14px; background:#241c0c; border-radius:10px; font-size:12px; color:#e0c98a; line-height:1.5;}

/* ===== Bottom nav ===== */
.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:rgba(20,20,20,0.92);
  backdrop-filter:blur(20px); border-top:1px solid #2c2c2c; padding-bottom:var(--safe-bottom); z-index:10;}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:9px 0 7px; color:#9a9a94; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;}
.tab.active{color:#fff;}
.tab .ti{font-size:19px;}

.installtip{margin:14px 18px 0; padding:12px 14px; background:#1a1a1a; border-radius:12px; font-size:12px; color:#9a9a94; line-height:1.6; display:flex; gap:10px; align-items:flex-start;}
.installtip .x{margin-left:auto; color:#9a9a94; font-size:16px; flex-shrink:0;}
</style>
</head>

, "icon": "subway"}, {"type": "stop", "time": "9h30", "activity": "Brunch \u2014 <b>The Grey Dog - Chelsea</b> (242 W 16th Street)", "duration": "1h", "price": "~110$ (~22$/pers.)", "isEnd": false, "link": "https://www.google.com/maps/dir/?api=1&origin=242+W+16th+St%2C+New+York%2C+NY&destination=75+9th+Ave%2C+New+York%2C+NY&travelmode=walking", "icon": "\ud83c\udf7d\ufe0f"}, {"type": "connector", "label": "15 min \u00e0 pied", "link": "https://www.google.com/maps/dir/?api=1&origin=242+W+16th+St%2C+New+York%2C+NY&destination=75+9th+Ave%2C+New+York%2C+NY&travelmode=walking", "icon": "walk"}, {"type": "stop", "time": "10h45", "activity": "Chelsea Market <i>(75 9th Ave)</i> ou Union Square", "duration": "1h", "price": "Gratuit", "isEnd": false, "link": "https://www.google.com/maps/dir/?api=1&origin=75+9th+Ave%2C+New+York%2C+NY&destination=Union+Square%2C+New+York%2C+NY&travelmode=walking", "icon": "\ud83e\udd56"}, {"type": "connector", "label": "10 min \u00e0 pied", "link": "https://www.google.com/maps/dir/?api=1&origin=75+9th+Ave%2C+New+York%2C+NY&destination=Union+Square%2C+New+York%2C+NY&travelmode=walking", "icon": "walk"}, {"type": "stop", "time": "11h55", "activity": "Derniers achats autour d'Union Square", "duration": "1h", "price": "Gratuit", "isEnd": false, "link": "https://www.google.com/maps/dir/?api=1&origin=Union+Square%2C+New+York%2C+NY&destination=Boerum+Hill%2C+Brooklyn%2C+NY&travelmode=transit", "icon": "\ud83d\udecd\ufe0f"}, {"type": "connector", "label": "30 min trajet", "link": "https://www.google.com/maps/dir/?api=1&origin=Union+Square%2C+New+York%2C+NY&destination=Boerum+Hill%2C+Brooklyn%2C+NY&travelmode=transit", "icon": "subway"}, {"type": "stop", "time": "13h25", "activity": "Bagages / pr\u00e9paration \u00e0 l'h\u00e9bergement", "duration": "35 min", "price": "Gratuit", "isEnd": false, "link": null, "icon": "\ud83d\ude87"}, {"type": "stop", "time": "14h00", "activity": "<b>D\u00e9part pour l'a\u00e9roport</b>", "duration": null, "price": "Gratuit", "isEnd": true, "link": null, "icon": "\ud83d\ude87"}]}]</script>
<script>const DAYS = JSON.parse(document.getElementById('daydata').textContent);
const BUDGET = {
  rows: [
    ['Activités, musées, restaurants (détail ci-dessous)', '~2 490$'],
    ['Métro (~22 trajets, groupe de 5)', '~330$'],
    ['Hôtel (40$/nuit × 10 nuits)', '400$'],
    ['Taxi Newark ↔ Brooklyn (170$ × 2)', '340$'],
    ['Taxi Paris ↔ Orly (41€ × 2 ≈ 93$)', '~93$'],
  ],
  total: '~3 653$',
  detail: [
    ['29/7', "Dîner — Junior's Restaurant", '~100$'],
    ['30/7', 'Déjeuner — Shake Shack Rockefeller Center', '~85$'],
    ['31/7', 'Déjeuner — Shake Shack Battery Park City', '~85$'],
    ['31/7', 'Staten Island Ferry (vue Statue de la Liberté)', 'Gratuit'],
    ['1/8', "Joe's Pizza (déjeuner)", '~40$'],
    ['2/8', 'Déjeuner — Lexington Candy Shop', '~80$'],
    ['2/8', 'Metropolitan Museum of Art', '150$'],
    ['3/8', 'Radio Bakery', '~50$'],
    ['3/8', 'Brooklyn Museum (facultatif, suggéré)', '~100$'],
    ['3/8', 'Déjeuner — Little Egg', '~90$'],
    ['4/8', 'Morgan Library', '~120$'],
    ['4/8', 'Déjeuner — Shake Shack Herald Square', '~85$'],
    ['4/8', 'Top of the Rock (coucher de soleil)', '~275$'],
    ['5/8', 'MoMA', '150$'],
    ['5/8', 'Déjeuner — The Halal Guys', '~65$'],
    ['5/8', 'Guggenheim', '150$'],
    ['6/8', 'American Museum of Natural History', '~170$'],
    ['6/8', 'Déjeuner — Shake Shack Upper West Side', '~85$'],
    ['7/8', 'Brunch — Café LULUc', '~110$'],
    ['7/8', "Déjeuner — Katz's Delicatessen", '~190$'],
    ['7/8', 'Dîner — Aqua Boil', '~200$'],
    ['8/8', 'Brunch — The Grey Dog - Chelsea', '~110$'],
  ]
};

let checked = {}; // key: `${dayId}_${stopIndex}` -> true
let currentDay = 0;
let currentScreen = 'home';

const app = document.getElementById('app');

function iconFor(icon){
  if(icon === 'subway') return '🚇';
  if(icon === 'ferry') return '⛴️';
  return '🚶';
}

async function loadChecked(){
  try{
    const raw = localStorage.getItem('nyc-trip-checked-items');
    if(raw) checked = JSON.parse(raw);
  }catch(e){ checked = {}; }
}
async function saveChecked(){
  try{ localStorage.setItem('nyc-trip-checked-items', JSON.stringify(checked)); }catch(e){}
}

function dayProgress(day){
  const stops = day.stops.filter(s=>s.type==='stop' && !s.isEnd);
  if(stops.length===0) return {done:0,total:0};
  let done=0;
  day.stops.forEach((s,idx)=>{ if(s.type==='stop' && !s.isEnd && checked[day.id+'_'+idx]) done++; });
  return {done, total:stops.length};
}

function renderHome(){
  let html = `
  <div class="hero">
    <div class="eyebrow">✈️ Programme du séjour</div>
    <h1>Voyage à New York<br>2026</h1>
    <div class="sub">29 juillet — 8 août · Boerum Hill, Brooklyn</div>
    <div class="stats">
      <div class="stat"><b>11</b>jours</div>
      <div class="stat"><b>5</b>voyageurs</div>
      <div class="stat"><b>~2 685$</b>budget total</div>
    </div>
  </div>
  <div class="linemap">
    <div class="maptitle">Votre ligne — jour par jour</div>
    ${DAYS.map(d=>{
      const p = dayProgress(d);
      const progressLabel = p.total ? `${p.done}/${p.total} faites` : '';
      return `<div class="dayrow" data-day="${d.id}" style="--dot-color:${d.color}">
        <div class="track" style="--dot-color:${d.color}"><div class="dot" style="background:${d.color}">${d.dayNumber}</div></div>
        <div class="info">
          <div class="d1">${d.dateLabel}</div>
          <div class="d2">${d.nameLabel}</div>
          ${progressLabel ? `<div class="progress">${progressLabel}</div>` : ''}
        </div>
        <div class="chev">›</div>
      </div>`;
    }).join('')}
  </div>
  <div class="installtip" id="installtip">
    <span>📲</span>
    <span>Ajoutez cette page à votre écran d'accueil (icône Partager → "Sur l'écran d'accueil") pour l'ouvrir comme une vraie app, plein écran.</span>
    <span class="x" id="closeInstall">✕</span>
  </div>
  `;
  return html;
}

function renderDay(dayId){
  const day = DAYS[dayId];
  let rows = '';
  day.stops.forEach((s, idx)=>{
    if(s.type === 'connector'){
      rows += `<div class="connector">
        <span class="ic">${iconFor(s.icon)}</span>
        <span>${s.label}</span>
        ${s.link ? `<a class="maplink" href="${s.link}" target="_blank">Voir →</a>` : ''}
      </div>`;
      return;
    }
    const key = day.id+'_'+idx;
    const isChecked = !!checked[key];
    const isFree = (s.price === 'Gratuit' || s.price === 'Inclus');
    const cardClass = s.isEnd ? 'card end' : 'card' + (isChecked ? ' done' : '');
    const showCheckbox = !s.isEnd;
    rows += `<div class="trow ${isChecked?'done':''}">
      <div class="rail"><div class="seg"></div><div class="node" style="--dot-color:${day.color}"></div><div class="seg"></div></div>
      <div class="content">
        <div class="${cardClass}" ${s.link ? `data-link="${s.link}"` : ''} data-key="${key}">
          <div class="ctop">
            <span class="cardicon">${s.icon||'📍'}</span>
            <span class="time">${s.time}</span>
            ${s.duration ? `<span class="dur">${s.duration}</span>` : ''}
          </div>
          <div class="act">${s.activity}</div>
          <div class="brow">
            <span class="price ${isFree?'free':''}">${s.price}</span>
            ${showCheckbox ? `<div class="cb" data-checkbox="${key}">${isChecked?'✓':''}</div>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  });

  return `
  <div class="topbar">
    <button class="backbtn" id="backHome">‹</button>
    <div class="bullet" style="background:${day.color}">${day.dayNumber}</div>
    <h1>${day.nameLabel}</h1>
  </div>
  <div class="daymeta">
    <div class="d1">${day.dateLabel}</div>
  </div>
  <div class="quote" style="--dot-color:${day.color}">
    "${day.quote.text}"
    <span class="auth">(${day.quote.author})</span>
  </div>
  ${day.notes.map(n=>`<div class="daynote">${n}</div>`).join('')}
  <div class="timeline">${rows}</div>
  `;
}

function renderBudget(){
  return `
  <div class="topbar"><h1 style="text-align:left">💰 Budget du séjour</h1></div>
  <div class="budgetcard">
    <h2>Récapitulatif</h2>
    ${BUDGET.rows.map(([label,amount])=>`<div class="brow2"><span>${label}</span><b>${amount}</b></div>`).join('')}
    <div class="brow2 total"><span>Total estimé</span><b>${BUDGET.total}</b></div>
  </div>
  <div class="budgetnote">Couvre billets, repas listés, transport en commun, hôtel et taxis aéroport. Vols internationaux et achats personnels non inclus.</div>
  <div class="warnbox">⚠️ Prix indicatifs 2026, non-résidents, hors taxes/pourboire/boissons, pour 2 adultes + 3 enfants majeurs (5 tarifs adulte). Le Top of the Rock a un tarif dynamique selon le créneau — à vérifier avant réservation. Taxi Orly converti au taux EUR/USD du jour (~1,137).</div>
  <div class="budgetcard" style="margin-top:0;">
    <h2>Détail activités & restaurants</h2>
    ${BUDGET.detail.map(([day,label,amount])=>`<div class="brow2"><span><b style="color:var(--text-dim);font-weight:700;">${day}</b> &nbsp;${label}</span><b>${amount}</b></div>`).join('')}
    <div class="brow2 total"><span>Sous-total</span><b>~2 518$</b></div>
  </div>
  `;
}

function renderTabbar(){
  return `
  <div class="tabbar">
    <div class="tab ${currentScreen==='home'?'active':''}" data-tab="home"><div class="ti">🗺️</div>Programme</div>
    <div class="tab ${currentScreen==='budget'?'active':''}" data-tab="budget"><div class="ti">💰</div>Budget</div>
  </div>`;
}

function render(){
  let inner = '';
  if(currentScreen === 'home') inner = renderHome();
  else if(currentScreen === 'day') inner = renderDay(currentDay);
  else if(currentScreen === 'budget') inner = renderBudget();

  app.innerHTML = `<div class="screen active">${inner}</div>` + renderTabbar();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentDay = parseInt(el.getAttribute('data-day'));
      currentScreen = 'day';
      render();
    });
  });
  const backBtn = document.getElementById('backHome');
  if(backBtn) backBtn.addEventListener('click', ()=>{ currentScreen='home'; render(); });

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentScreen = el.getAttribute('data-tab');
      render();
    });
  });

  document.querySelectorAll('[data-checkbox]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-checkbox');
      checked[key] = !checked[key];
      saveChecked();
      render();
    });
  });

  document.querySelectorAll('.card[data-link]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-checkbox]')) return;
      const link = el.getAttribute('data-link');
      if(link) window.open(link, '_blank');
    });
  });

  const closeInstall = document.getElementById('closeInstall');
  const tip = document.getElementById('installtip');
  if(closeInstall && tip){
    closeInstall.addEventListener('click', (e)=>{ e.stopPropagation(); tip.style.display='none'; });
  }
}

(async function init(){
  await loadChecked();
  render();
})();
</script>
</body>
</html>
